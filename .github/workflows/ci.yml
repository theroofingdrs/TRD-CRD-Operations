name: CRM build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify committed lockfile
        run: test -f package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check and production build
        run: npm run build
      - name: Set up Deno
        uses: denoland/setup-deno@v2
      - name: Type check Supabase Edge Functions
        run: |
          deno check supabase/functions/crm-invite-employee/index.ts
          deno check supabase/functions/crm-import-website-intake/index.ts

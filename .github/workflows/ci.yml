name: CRM build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify committed lockfile
        run: test -f package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check and production build
        run: npm run build
      - name: Set up Deno
        uses: denoland/setup-deno@v2
      - name: Type check Supabase Edge Functions
        run: |
          deno check supabase/functions/crm-invite-employee/index.ts
          deno check supabase/functions/crm-import-website-intake/index.ts
      - name: Build Cloud Run container
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL=https://example.supabase.co \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=ci-placeholder \
            --tag trd-crd-operations:ci .
      - name: Smoke test Cloud Run container
        run: |
          docker run --detach --rm --name trd-crm-ci --publish 8080:8080 trd-crd-operations:ci
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://localhost:8080/ > /tmp/crm-index.html; then
              break
            fi
            sleep 2
          done
          grep -q '<div id="root"></div>' /tmp/crm-index.html
          curl --fail --silent http://localhost:8080/robots.txt | grep -q 'Disallow: /'
          docker stop trd-crm-ci
